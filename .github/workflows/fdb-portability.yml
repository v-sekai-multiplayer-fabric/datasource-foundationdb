# Build and package FoundationDB on Windows and macOS, with Linux as the control.
#
# 7.3.76 ships deb, rpm and .so and nothing else, so neither Windows nor macOS has an
# upstream binary. One job per platform, and the targets chain in a single build tree:
# fdb_c -> fdbcli -> fdbserver -> package. fdbserver is the one that decides; a green
# fdb_c and fdbcli with a red fdbserver is a client-only port.
#
# Linux builds in the official foundationdb/build image. Windows needs a Visual Studio
# generator, because CMake enables the CSharp language nowhere else and FDB's actor
# compiler is a C# program, plus -T ClangCL, because flow uses GNU __attribute__ syntax
# and has never compiled under cl.exe. macOS needs almost no flags: cmake/ already knows
# the APPLE defaults.
#
# Packaging is FoundationDB's own where FoundationDB has one - WiX from packaging/msi/ on
# Windows, packaging/osx/buildpkg.sh on macOS. Linux uses fpm, because the in-tree deb and
# rpm rules run through CPack as part of `packages`, which builds far more than the control
# needs.
name: fdb portability

on:
  workflow_dispatch:
  push:
    branches: [portability-consensus]

permissions:
  contents: read

concurrency:
  group: fdb-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            container: foundationdb/build:rockylinux9-latest
            fdbserver_jobs: 3
          # Apple silicon, so this is the arm64 build. CMAKE_SYSTEM_PROCESSOR is "arm64",
          # not "aarch64", so ConfigureCompiler.cmake:428 does not add -march=armv8.2-a,
          # and USE_AVX finds no ^x86 and disables itself. 3 cores and 7 GB, the least
          # memory in the matrix.
          - os: macos
            runner: macos-14
            container: ""
            fdbserver_jobs: 3
          - os: windows
            runner: windows-2025
            container: ""
            fdbserver_jobs: 4

    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      # This fork, not apple/foundationdb: the port carries source fixes that cannot be made
      # from a CI file. It is origin/release-7.3 plus commits reviewable as a diff against it.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        if: matrix.os != 'linux'
        with: { python-version: "3.12" }

      # ProtocolVersion.h is generated by protocol_version.py, which imports Jinja2.
      - name: Jinja2 for ProtocolVersion.h codegen
        if: matrix.os != 'linux'
        run: pip install "Jinja2==3.1.6" "MarkupSafe==2.1.3"

      # mono is not on the runner image and EnableCsharp.cmake FATAL_ERRORs without mono and
      # mcs. openssl@3 is keg-only, hence the prefix passed at configure.
      #
      # Deliberately not installed: boost (CompileBoost.cmake asks 1.78.0 EXACT, so Homebrew's
      # is never selected and its headers only risk mixing with the 1.78 that is), fmt
      # (contrib asks 8.1.1 EXACT and falls back to contrib/fmt-8.1.1), lz4 (RocksDB only),
      # jemalloc (ConfigureCompiler.cmake:39 defaults it off for APPLE).
      - name: Dependencies (macos)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install mono ninja openssl@3
          mono --version | head -1

      - name: Cache vcpkg binaries (windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-static-lz4-fmt-zlib-openssl-v4

      # zlib and openssl are find_package(... REQUIRED) at FDBComponents.cmake:36-37 with no
      # guard; -DWITH_TLS=OFF is read later in the same file and does not reach them. The
      # -static triplet is required by ConfigureCompiler.cmake:120, which sets /MT.
      - name: Dependencies (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            vcpkg install lz4:x64-windows-static fmt:x64-windows-static \
                          zlib:x64-windows-static openssl:x64-windows-static && exit 0
            echo "::warning::vcpkg attempt $attempt failed; retrying"
          done
          exit 1

      # CompileBoost.cmake builds Boost everywhere except WIN32, where it either finds one or
      # calls FATAL_ERROR, so Windows has to be handed one. The version is bounded on both
      # sides: FDB asks for 1.78 or newer, and flow/IThreadPool.cpp uses boost::asio::io_service,
      # which Boost removed in 1.87 - so vcpkg's 1.91 cannot work.
      #
      # Prebuilt rather than compiled: every Boost old enough to keep io_service ships a b2 too
      # old to detect MSVC 14.51, and bootstrap fails with "Failed to build Boost.Build engine".
      # These are vc143 binaries and clang-cl targets the same ABI. 1.86 also ships
      # BoostConfig.cmake, which CMake 4.4 requires now that FindBoost is gone.
      - name: Cache Boost (windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/boost
          key: boost-1.86.0-msvc-14.3-x64-v1

      - name: Boost 1.86 (windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\boost"
          if (Test-Path "$prefix\boost\version.hpp") { "boost already cached at $prefix"; exit 0 }
          $url = "https://archives.boost.io/release/1.86.0/binaries/boost_1_86_0-msvc-14.3-64.exe"
          Invoke-WebRequest -Uri $url -OutFile boost-installer.exe
          # Inno Setup; /SP- suppresses the prompt /VERYSILENT alone leaves in place.
          Start-Process -Wait -FilePath .\boost-installer.exe `
            -ArgumentList '/VERYSILENT','/SP-','/SUPPRESSMSGBOXES',"/DIR=$prefix"
          if (-not (Test-Path "$prefix\boost\version.hpp")) { throw "boost headers missing" }
          if (-not (Test-Path "$prefix\lib64-msvc-14.3\cmake\Boost-1.86.0\BoostConfig.cmake")) {
            throw "BoostConfig.cmake missing; config mode would fail"
          }
          Get-ChildItem "$prefix" | Select-Object -First 10 Name

      # So an exit 137 is read as an OOM kill rather than guessed at.
      - name: Machine
        if: matrix.os != 'windows'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = macos ]; then
            sysctl -n hw.ncpu hw.memsize
          else
            nproc
            free -m
          fi
          df -h .

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # FDB_RELEASE=ON drops "-SNAPSHOT" and the build timestamp, so two runs of the same
          # commit produce the same package name (CMakeLists.txt:96).
          COMMON="-DBUILD_TESTING=OFF -DBUILD_DOCUMENTATION=OFF -DWITH_SWIFT=OFF
                  -DWITH_JAVA_BINDING=OFF -DWITH_GO_BINDING=OFF -DWITH_RUBY_BINDING=OFF
                  -DFDB_RELEASE=ON"
          if [ "${{ matrix.os }}" = windows ]; then
            # No -G: CMake's default is the newest installed Visual Studio, and this runner
            # ships VS 18, so naming "Visual Studio 17 2022" named one that is not there.
            #
            # -DBoost_COMPILER=vc143 is load-bearing. BoostDetectToolset reads Clang with
            # MSVC_VERSION set, concludes clangw22, and every vc143 component skips itself;
            # configure then dies at CompileBoost.cmake:156 on a missing Boost::filesystem,
            # two steps downstream of the cause. Boost_USE_STATIC_RUNTIME picks -mt-s-x64,
            # matching the /MT that ConfigureCompiler.cmake:120 sets and lld-link enforces.
            cmake -S . -B build $COMMON -A x64 -T ClangCL \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DBOOST_ROOT="${{ github.workspace }}/boost" \
              -DBOOST_LIBRARYDIR="${{ github.workspace }}/boost/lib64-msvc-14.3" \
              -DBoost_DIR="${{ github.workspace }}/boost/lib64-msvc-14.3/cmake/Boost-1.86.0" \
              -DBoost_COMPILER=vc143 -DBoost_USE_STATIC_LIBS=ON \
              -DBoost_USE_STATIC_RUNTIME=ON \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static \
              -DWITH_TLS=OFF -DUSE_JEMALLOC=OFF -DWITH_ROCKSDB=OFF 2>&1 | tee configure.log
            grep -E 'CMAKE_GENERATOR:|Boost' build/CMakeCache.txt | head -10 || true
          elif [ "${{ matrix.os }}" = macos ]; then
            # Only what cmake/ cannot work out: the keg-only OpenSSL prefix, and RocksDB off
            # to match the other two. jemalloc, the linker and libc++ are already handled for
            # APPLE by ConfigureCompiler.cmake and CompilerChecks.cmake. TLS stays on, as on
            # Linux. Boost is not installed, so FDB compiles its own 1.78 - the supported
            # macOS path, and the slowest step in this job.
            cmake -S . -B build $COMMON -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DWITH_ROCKSDB=OFF \
              -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" 2>&1 | tee configure.log
          else
            # RocksDB off, as on the other two: it is 340 targets before fdbserver starts, and
            # a control configured unlike what it controls answers a different question. LLD
            # because a BFD link of fdbserver runs the runner out of memory.
            cmake -S . -B build $COMMON -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DWITH_ROCKSDB=OFF -DUSE_LD=LLD 2>&1 | tee configure.log
          fi

      # Each step stops the job, so a failure names the first thing that broke. --config Release
      # is what the Visual Studio generator needs and what Ninja ignores.
      - name: Build fdb_c
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --target fdb_c --parallel 2>&1 | tee build-fdb_c.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdb_c.log | head -60
          exit $rc

      - name: Build fdbcli
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --target fdbcli --parallel 2>&1 | tee build-fdbcli.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbcli.log | head -60
          exit $rc

      # The one that decides; everything above is a client. Parallelism is bounded here and
      # nowhere else: fdbserver's actor-generated translation units are large enough that an
      # unqualified --parallel got the job killed at exit 137.
      - name: Build fdbserver
        shell: bash
        run: |
          set +e
          # GNU time takes -v, BSD time takes -l, and Windows has neither. Probe for the
          # binary rather than inferring it from the OS: the linux job runs inside
          # foundationdb/build:rockylinux9-latest, which does not ship GNU time (it is a
          # separate RPM), so assuming the platform implied the tool failed the build at
          # exit 127 before cmake was ever reached. macOS carries it in the base system,
          # which is why only linux broke and the failure looked like a compiler error.
          #
          # The measurement earns its keep (see the exit 137 note above), so install it
          # when a package manager is present and fall back to an unmeasured build when
          # it is not. Losing the peak-RSS line must not cost us the build.
          TIME=""
          if [ ! -x /usr/bin/time ] && [ "${{ matrix.os }}" = linux ] && command -v dnf >/dev/null 2>&1; then
            dnf install -y time >/dev/null 2>&1 || true
          fi
          if [ -x /usr/bin/time ]; then
            [ "${{ matrix.os }}" = linux ] && TIME="/usr/bin/time -v"
            [ "${{ matrix.os }}" = macos ] && TIME="/usr/bin/time -l"
          else
            echo "note: /usr/bin/time absent; building without peak-RSS measurement"
          fi
          $TIME cmake --build build --config Release --target fdbserver \
            --parallel ${{ matrix.fdbserver_jobs }} 2>&1 | tee build-fdbserver.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbserver.log | head -60
          grep -iE "maximum resident set size" build-fdbserver.log || true
          exit $rc

      - name: Package (fpm, linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -eu
          command -v gem >/dev/null && gem install --no-document fpm || {
            echo "::warning::no ruby; cannot run fpm"; exit 0; }
          mkdir -p stage/usr/bin stage/usr/lib
          cp build/bin/fdbserver build/bin/fdbcli stage/usr/bin/ 2>/dev/null || true
          cp build/lib/libfdb_c.* stage/usr/lib/ 2>/dev/null || true
          # From CMakeLists.txt, not typed here: a hardcoded version drifts on every rebase.
          V=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\) *$/\1/p' CMakeLists.txt | head -1)
          [ -n "$V" ] || { echo "::error::no VERSION in CMakeLists.txt"; exit 1; }
          for t in deb rpm; do
            fpm -s dir -t "$t" -n foundationdb-portability -v "$V" \
              --description "FoundationDB $V built from source for linux" \
              -C stage . || echo "::warning::fpm $t failed"
          done
          ls -l *.deb *.rpm 2>/dev/null || true

      # FDB's own packaging, unbuilt by any CI until now. buildpkg.sh reads build/version.txt,
      # bin/{fdbcli,fdbbackup,fdbserver,fdbmonitor}, lib/libfdb_c.dylib, the generated headers
      # and bindings/python/fdb/*.py, so the three targets the chain above has not built are
      # built first. No `|| true`: a package that silently is not produced is what this checks.
      - name: Package (pkgbuild, macos)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set +e
          cmake --build build --config Release \
            --target fdbbackup fdbmonitor python_binding --parallel 2>&1 | tee build-pkgdeps.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -iE "error|fatal|Could NOT find" build-pkgdeps.log | head -30; exit $rc
          fi
          mkdir -p build/packages
          ./packaging/osx/buildpkg.sh build . 2>&1 | tee pkg.log
          rc=${PIPESTATUS[0]}
          find build/packages -name '*.pkg' -print
          [ "$rc" -eq 0 ] && [ -z "$(find build/packages -name '*.pkg' -print -quit)" ] && {
            echo "::error::buildpkg.sh succeeded but produced no .pkg"; rc=1; }
          exit $rc

      # The target is `installer`; there is no target named MSI anywhere in the tree
      # (packaging/msi/CMakeLists.txt:53). FindWIX.cmake resolves candle and light through
      # $ENV{WIX}, so that is what is probed. `installer` also pulls in fdbmonitor, fdbbackup
      # and python_binding. No `|| true`, for the same reason as macOS above.
      - name: Package (MSI, windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set +e
          [ -n "$WIX" ] || echo "::warning::WIX env var unset; FindWIX resolves candle/light through it"
          cmake --build build --config Release --target installer --parallel 2>&1 | tee msi.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|WIX|No rule to make target" msi.log | head -30
          find build -name '*.msi' -print
          [ "$rc" -eq 0 ] && [ -z "$(find build -name '*.msi' -print -quit)" ] && {
            echo "::error::installer target succeeded but produced no .msi"; rc=1; }
          exit $rc

      - name: Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.os }}
          path: "*.log"
          if-no-files-found: warn

      - name: Binaries and packages
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: |
            build/bin/fdbserver
            build/bin/fdbcli
            build/lib/libfdb_c.so
            build/lib/libfdb_c.dylib
            build/**/*.exe
            build/**/fdb_c.dll
            build/**/*.msi
            build/packages/*.pkg
            *.deb
            *.rpm
          if-no-files-found: warn
