# FoundationDB for Linux, macOS and Windows: build the chain, then package it.
#
# Why this exists. FoundationDB supplies no Windows binaries — 7.3.76 carries deb, rpm,
# .so, x86_64 and aarch64 assets and nothing else, and no recent release differs. Upstream's
# `windows-boost-test.yml` looks like it covers the gap and does not: its step is named
# "Configure and Build" and runs only `cmake ..`.
#
# One job per platform, not one per target. The first version used a target matrix, and it
# was wrong twice over: three Windows jobs each spent forty minutes building the same Boost,
# and each rebuilt the whole of `flow` from scratch to reach its own target. Here the
# dependencies install once, `flow` compiles once, and the targets chain in one build tree:
#
#     fdb_c -> fdbcli -> fdbserver -> package
#
# The order is the point. `fdbserver` is the only target that decides anything: a green
# `fdb_c` and `fdbcli` with a red `fdbserver` is a client-only Windows, which has already
# been ruled insufficient. Chaining them means a failure names the first thing that broke,
# and nothing downstream runs to muddy it.
#
# Recipes come from sources that already work, not from guessing:
#
#   linux   — the official build image. README.md: "The official docker image for building
#             is foundationdb/build which has all dependencies installed." Four rounds were
#             lost finding jemalloc, then fmt, one at a time, before reading that sentence.
#             Linux is the control: until it is green, a red Windows job is ambiguous.
#   windows — lattice-world-weft/weft-warp-loop's flow-runtime.yml, which builds
#             FoundationDB's flow/ runtime green on windows-latest. Its comment gives the
#             rule: "flow uses GNU __attribute__ syntax throughout and has never compiled
#             under plain MSVC cl.exe - upstream FDB builds Windows with clang." Hence Ninja
#             and clang-cl, with msvc-dev-cmd for the environment clang-cl needs.
#
# Packaging is fpm on Linux and macOS, and FoundationDB's own WiX MSI on Windows —
# packaging/msi/ already holds FDBInstaller.wxs and cmake/FindWIX.cmake. That target chain
# needs python_binding, so no job disables it.
name: fdb portability

on:
  workflow_dispatch:
  push:
    branches: [portability-consensus]

permissions:
  contents: read

# A newer push supersedes an older run rather than racing it for runners.
concurrency:
  group: fdb-portability-${{ github.ref }}
  cancel-in-progress: true

env:
  FDB_REF: release-7.3

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            container: foundationdb/build:rockylinux9-latest
          - os: macos
            runner: macos-14
            container: ""
          - os: windows
            runner: windows-2025
            container: ""

    env:
      # vcpkg builds Boost from source, which is the slowest step on Windows by far. A
      # binary cache makes the second run minutes instead of an hour.
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v5
        with:
          repository: apple/foundationdb
          ref: ${{ env.FDB_REF }}

      - uses: actions/setup-python@v5
        if: matrix.os != 'linux'
        with: { python-version: "3.12" }

      # ProtocolVersion.h is generated by protocol_version.py, which imports Jinja2.
      - name: Jinja2 for ProtocolVersion.h codegen
        if: matrix.os != 'linux'
        run: pip install "Jinja2==3.1.6" "MarkupSafe==2.1.3"

      - name: Dependencies (macos)
        if: matrix.os == 'macos'
        run: brew install boost lz4 fmt jemalloc ninja autoconf automake libtool || true

      - name: Cache vcpkg binaries (windows)
        if: matrix.os == 'windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-windows-boost-lz4-fmt-v1

      # The exact components, not the whole Boost meta-port. This list is
      # lattice-world-weft/weft-warp-loop's vcpkg.json, which is known to build FoundationDB's
      # flow runtime on Windows. `boost:x64-windows` pulls all of Boost 1.91, and one run died
      # on `curl error 35 (SSL connect error)` fetching a LICENSE file — vcpkg calls error 35
      # non-transient and gives up. A smaller set is a smaller surface to flake on.
      #
      # boost-context is excluded on Windows, per that same manifest.
      - name: Dependencies (windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          for attempt in 1 2 3; do
            vcpkg install \
              boost-asio:x64-windows boost-bind:x64-windows boost-algorithm:x64-windows \
              boost-format:x64-windows boost-core:x64-windows boost-unordered:x64-windows \
              boost-container:x64-windows boost-preprocessor:x64-windows \
              boost-filesystem:x64-windows boost-iostreams:x64-windows \
              boost-serialization:x64-windows boost-program-options:x64-windows \
              boost-url:x64-windows boost-random:x64-windows boost-range:x64-windows \
              boost-intrusive:x64-windows boost-lockfree:x64-windows \
              boost-system:x64-windows boost-lexical-cast:x64-windows \
              boost-functional:x64-windows lz4:x64-windows fmt:x64-windows && exit 0
            echo "::warning::vcpkg attempt $attempt failed; retrying"
          done
          exit 1

      # clang-cl needs the MSVC environment to find the STL and the linker.
      - name: MSVC environment (windows)
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          COMMON="-G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
                  -DBUILD_DOCUMENTATION=OFF -DWITH_SWIFT=OFF -DWITH_JAVA_BINDING=OFF
                  -DWITH_GO_BINDING=OFF -DWITH_RUBY_BINDING=OFF"
          if [ "${{ matrix.os }}" = windows ]; then
            cmake -S . -B build $COMMON \
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl \
              -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
              -DWITH_TLS=OFF -DUSE_JEMALLOC=OFF -DWITH_ROCKSDB=OFF 2>&1 | tee configure.log
          elif [ "${{ matrix.os }}" = macos ]; then
            cmake -S . -B build $COMMON \
              -DWITH_TLS=OFF -DUSE_JEMALLOC=OFF -DWITH_ROCKSDB=OFF 2>&1 | tee configure.log
          else
            cmake -S . -B build $COMMON 2>&1 | tee configure.log
          fi

      # The chain. Each step stops the job, so a failure names the first thing that broke.
      - name: Build fdb_c
        shell: bash
        run: |
          set +e
          cmake --build build --target fdb_c --parallel 2>&1 | tee build-fdb_c.log
          rc=${PIPESTATUS[0]}
          echo "=== first 60 diagnostics ==="
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdb_c.log | head -60
          exit $rc

      - name: Build fdbcli
        shell: bash
        run: |
          set +e
          cmake --build build --target fdbcli --parallel 2>&1 | tee build-fdbcli.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbcli.log | head -60
          exit $rc

      # The one that decides. Everything above is a client.
      - name: Build fdbserver
        shell: bash
        run: |
          set +e
          cmake --build build --target fdbserver --parallel 2>&1 | tee build-fdbserver.log
          rc=${PIPESTATUS[0]}
          grep -iE "error|fatal|Could NOT find|cannot open" build-fdbserver.log | head -60
          exit $rc

      - name: Package (fpm, linux and macos)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -eu
          command -v gem >/dev/null && gem install --no-document fpm || {
            echo "::warning::no ruby; cannot run fpm"; exit 0; }
          mkdir -p stage/usr/bin stage/usr/lib
          cp build/bin/fdbserver build/bin/fdbcli stage/usr/bin/ 2>/dev/null || true
          cp build/lib/libfdb_c.* stage/usr/lib/ 2>/dev/null || true
          T=$([ "${{ matrix.os }}" = linux ] && echo "deb rpm" || echo "osxpkg")
          for t in $T; do
            fpm -s dir -t "$t" -n foundationdb-portability -v 7.3.76 \
              --description "FoundationDB 7.3.76 built from source for ${{ matrix.os }}" \
              -C stage . || echo "::warning::fpm $t failed"
          done
          ls -l *.deb *.rpm *.pkg 2>/dev/null || true

      - name: Package (MSI, windows)
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set +e
          ls "/c/Program Files (x86)/WiX Toolset v3.11/bin" >/dev/null 2>&1 \
            || echo "::warning::no WiX toolset found; the MSI target may not exist"
          cmake --build build --target MSI --parallel 2>&1 | tee msi.log
          rc=$?
          grep -iE "error|fatal|WIX|No rule to make target" msi.log | head -30
          exit $rc

      - name: Logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.os }}
          path: "*.log"
          if-no-files-found: warn

      - name: Binaries and packages
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: |
            build/bin/fdbserver
            build/bin/fdbcli
            build/lib/libfdb_c.so
            build/lib/libfdb_c.dylib
            build/**/*.exe
            build/**/fdb_c.dll
            build/**/*.msi
            *.deb
            *.rpm
            *.pkg
          if-no-files-found: warn
